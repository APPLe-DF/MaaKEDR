name: Check Docs

on:
  pull_request:
    paths:
      - "docs/**"
  push:
    branches: [main, master]
    paths:
      - "docs/**"

jobs:
  check-docs:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
